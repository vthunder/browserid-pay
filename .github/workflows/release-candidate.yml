# Release candidate: every check that decides a merge AND a deploy, run on
# the exact commit (sandmill-infra/ip-approval/PLAN.md). The public staging
# mirror runs it on every push, and sandmill-infra/bin/ip-submit.sh refuses
# a commit unless all of these jobs passed there. The canonical repo runs
# the identical workflow on every pull request to main, and branch
# protection requires every job. No path filters: a job that does not run
# is a failure, never a pass by absence.
#
# Jobs: the Rust workspace tests, the local end-to-end story (demo/
# run-local.mjs: custodian, judge, indexer, demo-idp and a stub daemon), the
# JS SDK tests, the supply-chain audit, and every production image the
# deploy workflows build, built the same way and started with a throwaway
# config. Tests run in a network namespace with loopback only
# (scripts/ci-offline.sh), so none can depend on the public internet.
#
# .cargo/config.toml patches the browserid-ng crates to a sibling checkout
# for local development; .dockerignore keeps it out of the images, and the
# jobs below delete it so that they, too, build the pinned git source with
# the committed Cargo.lock.
name: release-candidate
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rc / rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same toolchain as every Dockerfile's builder stage; checked below.
      - uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93.1
      - name: toolchain is exactly the one the Dockerfiles' pinned image carries
        run: |
          refs="$(sed -nE 's/^FROM (rust:[^ ]+) AS builder.*/\1/p' crates/*/Dockerfile | sort -u)"
          n="$(cat crates/*/Dockerfile | grep -c '^FROM rust:')"
          [ "$(cat crates/*/Dockerfile | grep -cE '^FROM rust:[0-9]+\.[0-9]+\.[0-9]+-[a-z]+@sha256:[0-9a-f]{64} AS builder')" = "$n" ] \
            || { echo "::error::every FROM rust: must be rust:<x.y.z>-<suite>@sha256:<digest> AS builder"; exit 1; }
          [ "$(echo "$refs" | wc -l)" = 1 ] || { echo "::error::Dockerfiles disagree on the rust image: $refs"; exit 1; }
          ref="$refs"
          tag="$(sed -nE 's/^rust:([0-9.]+)-.*/\1/p' <<<"$ref")"
          img="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' | jq -r '."linux/amd64".config.Env[]? // .config.Env[]?' | sed -n 's/^RUST_VERSION=//p')"
          have="$(rustc --version | awk '{print $2}')"
          echo "Dockerfile tag $tag, image carries $img, this job runs $have"
          [ -n "$tag" ] && [ "$tag" = "$img" ] && [ "$img" = "$have" ] || { echo "::error::toolchain mismatch: tag $tag, image $img, CI $have"; exit 1; }
      - name: drop the local-development patch (as .dockerignore does)
        run: rm .cargo/config.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build the tests
        run: cargo test --workspace --locked --no-run
      - name: the offline sandbox has no network
        run: |
          if scripts/ci-offline.sh curl -sS --max-time 5 -o /dev/null https://github.com; then
            echo "::error::scripts/ci-offline.sh reached the internet"; exit 1
          fi
      - name: workspace tests (offline)
        run: scripts/ci-offline.sh cargo test --workspace --locked --offline

  e2e:
    name: rc / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93.1
      - name: drop the local-development patch (as .dockerignore does)
        run: rm .cargo/config.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build the services
        run: cargo build --locked -p custodian -p judge -p demo-idp -p indexer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: install the demo and the SDK it links
        run: |
          for d in sdk/agreements demo; do
            (cd "$d" && npm ci --ignore-scripts --no-audit --no-fund)
          done
      - name: settle, dispute and ruling, end to end (offline)
        working-directory: demo
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          DEMO_VERBOSE: "1"
        run: ../scripts/ci-offline.sh node run-local.mjs

  sdk:
    name: rc / sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: install (sdk/agreements)
        working-directory: sdk/agreements
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: agreements (offline)
        working-directory: sdk/agreements
        run: ../../scripts/ci-offline.sh node --test
      # No tests and no lockfile; at least it must parse.
      - name: agreements-mcp parses
        run: node --check sdk/agreements-mcp/server.mjs

  audit:
    name: rc / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit
      - uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: scripts/supply-chain-audit.sh rust
      - run: scripts/supply-chain-audit.sh node
      - name: gitleaks (full history of HEAD)
        run: |
          v=8.30.1; sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "$sum  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner

  # Every image a deploy workflow builds, built the same way (same action,
  # file, context and platform; loaded, not pushed), then started with a
  # throwaway production-shaped config whose upstreams all point at a closed
  # local port, and probed on /healthz twice, a few seconds apart, so a
  # startup task that crashes the process is caught too.
  image:
    name: rc / image ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pay
            file: crates/custodian/Dockerfile
            env: "-e PAY_ORIGIN=http://localhost:18080 -e ADMIN_TOKEN=rc -e PAY_SESSION_SECRET=rc -e BROKER=http://127.0.0.1:9 -e DAEMON=http://127.0.0.1:9 -e PAY_INDEX_ORIGIN=http://127.0.0.1:9 -e PAY_JUDGE_ORIGIN=http://127.0.0.1:9"
          - app: judge
            file: crates/judge/Dockerfile
            env: "-e JUDGE_ORIGIN=http://localhost:18080 -e BROKER=http://127.0.0.1:9 -e SBO_DAEMON=http://127.0.0.1:9 -e JUDGE_CUSTODIANS=http://127.0.0.1:9"
          - app: index
            file: crates/indexer/Dockerfile
            env: "-e INDEX_ORIGIN=http://localhost:18080 -e DAEMON=http://127.0.0.1:9"
          - app: relay
            file: crates/relay/Dockerfile
            env: "-e RELAY_ORIGIN=http://localhost:18080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build (as deploy-${{ matrix.app }}.yml does, without pushing)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: rc-${{ matrix.app }}
          cache-from: type=gha,scope=rc-${{ matrix.app }}
          cache-to: type=gha,scope=rc-${{ matrix.app }},mode=max
      - name: start and probe
        run: |
          docker run -d --name rc -p 18080:5000 ${{ matrix.env }} rc-${{ matrix.app }}
          up=0
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/healthz >/dev/null && { up=1; echo "healthy after ${i}s"; break; }
            [ "$(docker inspect -f '{{.State.Running}}' rc)" = true ] || break
            sleep 1
          done
          [ "$up" = 1 ] || { echo "::error::${{ matrix.app }} image did not become healthy"; docker logs rc; exit 1; }
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' rc)" = true ] && curl -sf http://127.0.0.1:18080/healthz >/dev/null \
            || { echo "::error::${{ matrix.app }} stopped answering after startup"; docker logs rc; exit 1; }
          docker logs rc 2>&1 | tail -20
