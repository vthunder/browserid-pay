[workspace]
resolver = "2"
members = ["crates/custodian", "crates/genesis", "crates/judge", "crates/indexer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/vthunder/browserid-pay"

[workspace.dependencies]
# browserid-ng crates, pinned by git rev (bump to adopt changes). During
# development against a local checkout, use the [patch] section below.
browserid-core = { git = "https://github.com/vthunder/browserid-ng", rev = "a310de7" }
browserid-rp = { git = "https://github.com/vthunder/browserid-ng", rev = "a310de7" }
browserid-dnssec = { git = "https://github.com/vthunder/browserid-ng", rev = "a310de7" }
browserid-agent = { git = "https://github.com/vthunder/browserid-ng", rev = "a310de7" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
# The SBO reference implementation (vthunder/sbo), pinned by rev like mingo does.
sbo-core = { git = "https://github.com/vthunder/sbo", rev = "4a2b056", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
